<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="rigaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark Metallic Rounded Card -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#090410" stroke="#a855f7" stroke-width="2.5" />
  
  <!-- Stylized R Monogram + Dancer Art -->
  <g filter="url(#neonGlow)">
    <!-- Elegant R Letterform -->
    <path d="M 28 25 L 48 25 C 58 25 64 30 64 38 C 64 45 58 50 48 50 L 28 50 Z M 28 50 L 28 75 M 46 50 L 62 75" 
          fill="none" 
          stroke="url(#rigaGrad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Gold/Magenta Accent Dot -->
    <circle cx="68" cy="26" r="4" fill="#f43f5e" />
  </g>
</svg>